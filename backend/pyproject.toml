[project]
name = "ghostline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26,<2.3",
  "scipy>=1.13",
  "opencv-python-headless>=4.10",
  "pysindy>=1.7",
  "statsmodels>=0.14",
  "openai>=1.40",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghostline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
